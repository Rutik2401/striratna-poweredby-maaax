<div class="toast-region" role="region" aria-label="Notifications" aria-live="polite">
  @for (toast of toasts(); track toast.id) {
    <div class="toast toast--{{ toast.tone }}" role="status">
      <span class="toast__icon" aria-hidden="true">
        @switch (toast.tone) {
          @case ('success') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
          }
          @case ('error') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v2m0 4h.01M4.9 19h14.2a2 2 0 001.7-3L12.9 4a2 2 0 00-3.5 0L3.2 16a2 2 0 001.7 3z"/>
            </svg>
          }
          @case ('warning') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01"/>
              <circle cx="12" cy="12" r="9.5"/>
            </svg>
          }
          @case ('info') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v.01M11 12h1v4m-1 0h2"/>
              <circle cx="12" cy="12" r="9.5"/>
            </svg>
          }
        }
      </span>

      <div class="toast__body">
        <p class="toast__title">{{ toast.title }}</p>
        @if (toast.message) {
          <p class="toast__message">{{ toast.message }}</p>
        }
      </div>

      @if (toast.dismissible) {
        <button
          type="button"
          class="toast__close"
          aria-label="Dismiss notification"
          (click)="dismiss(toast.id)"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6l-12 12"/>
          </svg>
        </button>
      }

      @if (toast.durationMs > 0) {
        <span class="toast__progress" [style.animation-duration.ms]="toast.durationMs"></span>
      }
    </div>
  }
</div>
